server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker: resuelve el nombre del servicio cuando llega la petición
    resolver 127.0.0.11 valid=5s;

    # El navegador llama a /api/... y nginx lo reenvía al servicio correspondiente

    location /api/clientes {
        set $destino http://clientes:5000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $destino;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location /api/asesores {
        set $destino http://asesores:5000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $destino;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location /api/turnos {
        set $destino http://turnos:5000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $destino;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
}
